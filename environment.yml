# The environment used for the paper (versions as run). run_all.sh needs only the analysis packages; the measurement
# scripts in scripts/measure/ also need the ones marked "measurement". mlx-whisper runs on Apple silicon only.
name: accents
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy=2.4.6
  - pandas=3.0.6
  - scipy=1.17.1
  - scikit-learn=1.9.1
  - matplotlib=3.11.2
  - xlsxwriter=3.2.9
  - montreal-forced-aligner=3.4.3     # measurement
  - ffmpeg                            # measurement
  - pytorch=2.13.0                    # measurement
  - torchaudio=2.11.0                 # measurement
  - pip
  - pip:
      - adjustText==1.3.0
      - praat-parselmouth==0.4.7      # measurement
      - praatio==6.2.2                # measurement
      - librosa==0.11.0               # measurement
      - soundfile==0.14.0             # measurement
      - silero-vad==6.2.3             # measurement
      - speechbrain==1.1.1            # measurement
      - mlx-whisper==0.4.3            # measurement
      - yt-dlp==2026.8.19             # measurement
